<svg viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Градиенты фона -->
    <linearGradient id="sw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Красный фирменный акцент SolidWorks -->
    <linearGradient id="sw-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Голубой инженерный свечение -->
    <linearGradient id="cad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Металлический градиент детали -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Фильтры свечения -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Задний фон -->
  <rect width="1200" height="420" fill="url(#sw-bg)" rx="16" />

  <!-- Инженерная чертежная сетка (Isometric Grid) -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1" fill="none">
    <path d="M0 0 L1200 420 M0 60 L1200 480 M0 120 L1200 540 M0 180 L1200 600 M0 240 L1200 660 M0 300 L1200 720 M0 360 L1200 780" />
    <path d="M0 420 L1200 0 M0 360 L1200 -60 M0 300 L1200 -120 M0 240 L1200 -180 M0 180 L1200 -240 M0 120 L1200 -300 M0 60 L1200 -360" />
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200" />
    <path d="M200 0 V420 M400 0 V420 M600 0 V420 M800 0 V420 M1000 0 V420" />
  </g>

  <!-- ИЗОМЕТРИЧЕСКАЯ 3D-ДЕТАЛЬ / КУБ (Слева) -->
  <g transform="translate(140, 110)">
    <!-- Оси координат (X, Y, Z) -->
    <g stroke-width="2" stroke-linecap="round">
      <line x1="110" y1="100" x2="210" y2="150" stroke="#EF4444" /> <!-- X axis -->
      <line x1="110" y1="100" x2="10" y2="150" stroke="#22C55E" />  <!-- Y axis -->
      <line x1="110" y1="100" x2="110" y2="0" stroke="#3B82F6" />   <!-- Z axis -->
    </g>

    <!-- 3D Куб / Модель -->
    <!-- Верхняя грань -->
    <polygon points="110,20 180,55 110,90 40,55" fill="url(#metal-grad)" stroke="#38BDF8" stroke-width="2" />
    <!-- Левая грань -->
    <polygon points="40,55 110,90 110,180 40,145" fill="#0F172A" stroke="#38BDF8" stroke-width="2" opacity="0.9" />
    <!-- Правая грань -->
    <polygon points="110,90 180,55 180,145 110,180" fill="#1E293B" stroke="#38BDF8" stroke-width="2" opacity="0.9" />

    <!-- Вырез / Внутренний элемент (CAD Опрессовка) -->
    <polygon points="110,40 150,60 110,80 70,60" fill="none" stroke="#E11D48" stroke-width="2" filter="url(#glow-red)" />

    <!-- Размерные линии (Dimensions) -->
    <g stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3">
      <line x1="40" y1="155" x2="40" y2="195" />
      <line x1="180" y1="155" x2="180" y2="195" />
      <line x1="40" y1="190" x2="180" y2="190" stroke-dasharray="none" marker-start="url(#dot)" marker-end="url(#dot)" />
    </g>
    <text x="110" y="210" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">R 50.00 mm</text>
  </g>

  <!-- ТЕКСТОВАЯ ЧАСТЬ (Справа) -->
  <g transform="translate(420, 130)">
    <!-- Тэг плагина / версии -->
    <rect x="0" y="0" width="160" height="28" rx="6" fill="#E11D48" opacity="0.2" stroke="#E11D48" stroke-width="1" />
    <text x="80" y="18" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="bold" font-size="12" fill="#F43F5E" text-anchor="middle">CAD / CAM TOOLKIT</text>

    <!-- Основной заголовок -->
    <text x="0" y="80" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">
      SOLIDWORKS
    </text>
    
    <text x="0" y="125" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="34" fill="url(#cad-blue)" filter="url(#glow-blue)">
      AUTOMATION UTILITY
    </text>

    <!-- Подзаголовок -->
    <text x="0" y="170" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="16" fill="#94A3B8">
      Parametric Modeling · Macro Library · API Integration
    </text>

    <!-- Бейджи / Фичи -->
    <g transform="translate(0, 200)">
      <!-- VBA / API -->
      <rect x="0" y="0" width="100" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="50" y="20" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">VBA / C#</text>

      <!-- 3D CAD -->
      <rect x="110" y="0" width="110" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="165" y="20" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="bold" fill="#F43F5E" text-anchor="middle">3D & 2D Export</text>

      <!-- Macro -->
      <rect x="230" y="0" width="110" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="285" y="20" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="bold" fill="#10B981" text-anchor="middle">Auto-BOM</text>
    </g>
  </g>
</svg>